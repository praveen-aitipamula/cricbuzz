{% extends "base.html" %}
 {% block content  %}
<h1>IPL Points Table</h1>

<div class="points-table-container">

    <h1 class="points-title">
        IPL 2026 Points Table
    </h1>

    <table class="points-table">

        <thead>
            <tr>
                <th>Pos</th>
                <th>Team</th>
                <th>P</th>
                <th>W</th>
                <th>L</th>
                <th>Pts</th>
            </tr>
        </thead>

        <tbody>

            {% for row in table %}

            <tr>

                <td>{{ forloop.counter }}</td>

                <td class="team-cell">
                    {{ row.team.short_name }}
                </td>

                <td>{{ row.played }}</td>

                <td>{{ row.won }}</td>

                <td>{{ row.lost }}</td>

                <td class="points-cell">
                    {{ row.points }}
                </td>

            </tr>

            {% endfor %}

        </tbody>

    </table>

</div>
{% endblock  %}
