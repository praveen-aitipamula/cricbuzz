{% extends "base.html" %}

{% block content %}

<h1>Players</h1>

<div class="players-container">

    {% for player in players %}
    
    <div class="player-card">

        <div class="player-avatar">
            {{ player.name|first }}
        </div>

        <h3>{{ player.name }}</h3>

        <div class="team-name">
            {{ player.team.short_name }}
        </div>

        <div class="role">
            {{ player.get_role_display }}
        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
